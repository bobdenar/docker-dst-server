; Here is all the server configs you will ever want to change
;
; WARNING: every setting below (down to [MISC]) is rewritten from the container's
; environment variables on EVERY container start (see scripts_system/entrypoint.sh).
; Editing them by hand here is USELESS: your edits will be overwritten on next
; restart. Set the matching DST_* environment variable in the container/stack
; instead (see README.md). The env var for each setting is noted in a comment
; right above it.
[NETWORK]
; DO change the name and description please!
; DST_CLUSTER_NAME
cluster_name = Another docker-dst-server
; DST_CLUSTER_DESCRIPTION
cluster_description = This is the default server config for docker-dst-server project.
; DST_CLUSTER_PASSWORD
cluster_password =
; DST_OFFLINE_CLUSTER
offline_cluster = false
; DST_LAN_ONLY_CLUSTER
lan_only_cluster = false
; DST_WHITELIST_SLOTS
whitelist_slots = 1
; DST_CLUSTER_INTENTION
cluster_intention = social
; DST_AUTOSAVER_ENABLED
autosaver_enabled = true
;tick_rate = 30

[GAMEPLAY]
; DST_GAME_MODE
game_mode = endless
; DST_MAX_PLAYERS
max_players = 10
; DST_PVP
pvp = false
; DST_PAUSE_WHEN_EMPTY
pause_when_empty = true
; DST_VOTE_KICK_ENABLED
vote_kick_enabled = false

[STEAM]
; DST_STEAM_GROUP_ONLY
steam_group_only = false
; DST_STEAM_GROUP_ID
steam_group_id = 0
; DST_STEAM_GROUP_ADMINS
steam_group_admins = false

[MISC]
; DST_CONSOLE_ENABLED
console_enabled = true
; DST_MAX_SNAPSHOTS
max_snapshots = 6

; ====================================================================
; STOP! Don't change configs below unless you know what you are doing.
; ====================================================================
[SHARD]
shard_enabled = true
bind_ip = 127.0.0.1
master_ip = 127.0.0.1
master_port = 10998
cluster_key = MsAhBOXhhnElO5IPKr4G
